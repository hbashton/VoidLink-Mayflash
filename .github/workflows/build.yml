name: Build VoidLink test IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        required: true
        default: mayflash-generic-profile
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive app
        run: |
          xcodebuild \
            -scheme VoidLink \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            archive \
            -archivePath "$GITHUB_WORKSPACE/build/VoidLink.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/VoidLink.xcarchive/Products/Applications/VoidLink.app"
          test -f "$APP_PATH/Info.plist"
          mkdir -p build/IPA/Payload
          ditto "$APP_PATH" build/IPA/Payload/VoidLink.app
          cd build/IPA
          zip -ry "../VoidLink-${GITHUB_RUN_NUMBER}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-${{ github.run_number }}
          path: build/VoidLink-${{ github.run_number }}.ipa
          retention-days: 14
          if-no-files-found: error